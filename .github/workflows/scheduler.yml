name: ClubFlex background jobs

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub scheduling congestion.
    - cron: "2/5 * * * *"
    # A monthly repository heartbeat prevents public schedules from becoming
    # inactive after 60 days without repository activity.
    - cron: "17 4 1 * *"
  workflow_dispatch:

concurrency:
  group: clubflex-production-scheduler
  cancel-in-progress: false

jobs:
  scheduler:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '2/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Run due ClubFlex jobs
        env:
          SCHEDULER_URL: ${{ secrets.CF_SCHEDULER_URL }}
          SCHEDULER_TOKEN: ${{ secrets.CF_SCHEDULER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SCHEDULER_URL}"
          test -n "${SCHEDULER_TOKEN}"

          response_file="$(mktemp)"
          status="$(
            curl \
              --silent \
              --show-error \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              --max-time 115 \
              --retry 1 \
              --retry-delay 10 \
              --retry-all-errors \
              --request POST \
              --header "Authorization: Bearer ${SCHEDULER_TOKEN}" \
              --header "Accept: application/json" \
              "${SCHEDULER_URL}"
          )"

          cat "${response_file}"
          echo
          test "${status}" = "200"

  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '17 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record repository activity
        shell: bash
        run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .scheduler-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .scheduler-keepalive
          git commit -m "chore: keep scheduler active"
          git push
